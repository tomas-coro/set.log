<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12100e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="set.log">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>set.log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel-2:#211d19; --panel-3:#282219;
    --line:#332d26; --line-soft:#2a251f;
    --ink:#f3ede3; --ink-dim:#b3a897; --ink-faint:#857c6d;
    --accent:#ff6a1a; --accent-soft:#ffb37a; --accent-dim:#7a3d13;
    --green:#7bd88f; --red:#ff5b52; --blue:#6aa9ff;
    --display:"Barlow Condensed",Impact,sans-serif;
    --body:"Barlow",system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-soft:cubic-bezier(.33,1,.68,1);
    --spring:cubic-bezier(.22,1.4,.36,1);
    --navh:58px;                     /* altezza vera del tabbar, misurata a runtime */
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* altezza reale del viewport: dvh da solo non basta su Safari iOS quando
     l'elemento e' position:fixed (bug WebKit noto - il fixed segue il visual
     viewport ma il CSS non sempre si riallinea da solo). --vvh e' impostata
     via JS da window.visualViewport e vince su top/bottom perche' un height
     esplicito ha priorita' sul "bottom" in un fixed over-constrained. */
  html,body{height:100%;height:100dvh;height:var(--vvh,100dvh)}
  html{background:var(--bg)}
  /* body bloccato a schermo: lo scroll vive dentro #app. Cosi' la barra indirizzo
     del browser mobile non si nasconde/riappare e il tabbar non "salta" piu'. */
  body{position:fixed;inset:0;overflow:hidden}
  body{
    background:
      radial-gradient(130% 55% at 100% 0%, rgba(255,106,26,.09), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--body); line-height:1.45;
    text-wrap:pretty; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;color:inherit}
  input::placeholder{color:var(--ink-faint)}

  /* layout: shell in colonna, contenuto scrollabile + tabbar fisso nel flusso */
  #shell{position:relative;height:100%;height:100dvh;height:var(--vvh,100dvh);max-width:560px;margin:0 auto}
  /* il contenuto scorre DIETRO il tabbar: e' cio' che il vetro sfoca */
  #app{height:100%;overflow-y:auto;overflow-x:hidden;
       -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
       padding-bottom:calc(var(--navh) + 12px)}
  #navwrap{position:absolute;left:0;right:0;bottom:0;z-index:20}
  .screen{padding:calc(18px + var(--safe-t)) 16px 16px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  /* entrata direzionale: usata quando cambi tab con lo swipe o torni indietro */
  @keyframes slideFwd{from{opacity:.25;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes slideBack{from{opacity:.25;transform:translateX(-26px)}to{opacity:1;transform:none}}
  #app.slide-fwd .screen{animation:slideFwd .3s var(--ease-soft)}
  #app.slide-back .screen{animation:slideBack .3s var(--ease-soft)}
  @keyframes pop{0%{transform:scale(.4);opacity:.2}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* entrata a cascata SOLO quando si cambia vista (classe .nav su #app) */
  #app.nav .screen{animation:fade .3s var(--ease)}
  #app.nav .screen>*{animation:rise .55s var(--ease) both}
  #app.nav .screen>*:nth-child(1){animation-delay:0s}
  #app.nav .screen>*:nth-child(2){animation-delay:.05s}
  #app.nav .screen>*:nth-child(3){animation-delay:.10s}
  #app.nav .screen>*:nth-child(4){animation-delay:.15s}
  #app.nav .screen>*:nth-child(5){animation-delay:.20s}
  #app.nav .screen>*:nth-child(6){animation-delay:.25s}
  #app.nav .screen>*:nth-child(7){animation-delay:.29s}
  #app.nav .screen>*:nth-child(n+8){animation-delay:.33s}
  @media (hover:hover){
    .day-item:hover{border-color:var(--accent-dim);transform:translateY(-1px)}
    .btn:hover{filter:brightness(1.09)}
    .chip:hover{border-color:var(--accent-dim);color:var(--ink)}
    .hist:hover{border-color:var(--line);filter:brightness(1.05)}
  }
  @media (prefers-reduced-motion:reduce){
    *,#app.nav .screen,#app.nav .screen>*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* top bar */
  .topbar{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .topbar h1{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:30px;line-height:.95;letter-spacing:-.01em;
  }
  .topbar h1 span{color:var(--accent)}
  .topbar .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
  /* lockup set.log (solo home): mark (barre) + wordmark tipo nome-file */
  .brand-mark{width:38px;height:38px;flex:none;display:block}
  .brand-mark svg{width:38px;height:38px;display:block}
  .brandwrap{min-width:0}
  .wordmark{
    font-family:var(--mono);font-weight:700;
    font-size:27px;line-height:1;letter-spacing:-.02em;
    display:flex;align-items:baseline;color:var(--ink);
  }
  .wordmark .dot{color:var(--accent)}
  .wordmark .caret{display:inline-block;width:10px;height:18px;background:var(--accent);
    margin-left:5px;transform:translateY(2px);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .wordmark .caret{animation:none} }
  .back-btn{font-family:var(--mono);font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;padding:6px 2px}
  .spacer{flex:1}

  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .muted{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .mono{font-family:var(--mono)}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    transition:transform .06s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.block{display:flex;width:100%}
  .btn.accent{background:var(--accent);color:#1a1109;border-color:transparent;font-weight:700;box-shadow:0 8px 22px -8px rgba(255,106,26,.55)}
  .btn.accent:active{box-shadow:0 4px 12px -8px rgba(255,106,26,.55)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:#4a2a27}
  .btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
  .btn.icon{min-height:44px;min-width:44px;padding:0}

  .row{display:flex;gap:10px}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}

  /* start card */
  .hero{
    background:linear-gradient(160deg,var(--panel-3),var(--panel));
    border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
    background:radial-gradient(circle,rgba(255,106,26,.22),transparent 70%)}
  .hero .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft)}
  .hero .dayname{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:40px;line-height:.95;margin:4px 0 2px}
  .hero .focus{color:var(--ink-dim);font-size:14px;margin-bottom:16px}

  /* day list */
  .day-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;margin-bottom:10px;transition:transform .06s ease}
  .day-item:active{transform:scale(.98)}
  .day-item .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent-soft);min-width:20px}
  .day-item .info{flex:1}
  .day-item .info .t{font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;line-height:1}
  .day-item .info .m{font-size:12px;color:var(--ink-faint);font-family:var(--mono);margin-top:3px}
  .day-item .chev{color:var(--ink-faint);font-size:20px}
  .day-item.next{border-color:var(--accent-dim);box-shadow:0 0 0 1px var(--accent-dim) inset}

  /* section header */
  .sec-h{font-family:var(--display);text-transform:uppercase;font-size:17px;letter-spacing:.02em;
    margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
  .sec-h::before{content:"";width:22px;height:3px;background:var(--accent)}

  /* active session */
  .sess-bar{position:sticky;top:0;z-index:5;background:rgba(18,16,14,.92);backdrop-filter:blur(8px);
    margin:calc(-18px - var(--safe-t)) -16px 14px;padding:calc(12px + var(--safe-t)) 16px 12px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .sess-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--line)}
  .sess-prog i{display:block;height:100%;background:var(--accent);border-radius:0 2px 2px 0;transition:width .45s var(--ease)}
  .sess-bar .sess-back{font-size:28px;line-height:1;color:var(--ink-faint);
    width:44px;height:44px;margin-left:-12px;flex:none;align-self:center;
    display:flex;align-items:center;justify-content:center}
  .sess-bar .clock{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.02em}
  .sess-bar .clock.paused{color:var(--ink-faint)}
  .sess-bar .clock small{font-size:12px;color:var(--ink-faint)}
  .sess-bar .t{flex:1}
  .sess-bar .t .name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1}
  .sess-bar .t .prog{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
  .sess-bar .sess-pause,.sess-bar .sess-cancel{font-size:17px;line-height:1;color:var(--ink-faint);
    width:34px;height:34px;flex:none;align-self:center;border-radius:10px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center}
  .sess-bar .sess-cancel{color:var(--red)}

  .ex-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .ex-card.done{border-color:#2f4a34}
  .ex-card.skipped{opacity:.5}
  .ex-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px}
  .ex-head .nm{flex:1}
  .ex-head .nm .name{font-weight:700;font-size:17px}
  .ex-head .nm .tgt{font-family:var(--mono);font-size:12px;color:var(--accent-soft);margin-top:2px}
  .ex-head .nm .tgt span{color:var(--ink-faint)}
  .ex-menu-btn{color:var(--ink-faint);font-size:22px;padding:2px 8px;line-height:1}

  .set-row{display:grid;grid-template-columns:22px 1fr 1fr 44px 30px;gap:7px;align-items:center;
    padding:8px 14px;border-top:1px solid var(--line-soft)}
  .set-row .si{font-family:var(--mono);font-size:13px;color:var(--ink-faint);text-align:center}
  .set-row .fld{position:relative}
  .set-row input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:11px 8px 11px 10px;font-size:16px;font-weight:600;text-align:center}
  .set-row input:focus{outline:none;border-color:var(--accent)}
  .set-row .unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-faint);font-family:var(--mono);pointer-events:none}
  .set-row .last{grid-column:2/4;font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding-left:2px;margin-top:-2px}
  .pr-flag{position:absolute;top:-7px;right:-5px;z-index:2;font-family:var(--mono);font-weight:700;
    font-size:9px;letter-spacing:.05em;color:#1a0d03;background:var(--accent);border-radius:5px;
    padding:1px 4px;box-shadow:0 2px 6px -1px rgba(255,106,26,.6);pointer-events:none}
  /* week card (streak + calendario settimana) */
  .week-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 14px;margin-bottom:16px}
  .wk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .wk-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-faint)}
  .wk-streak{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
  .wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .wd{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
    display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .wd.on{background:var(--accent);border-color:var(--accent);color:#1a0d03;font-weight:700}
  .wd.today{box-shadow:0 0 0 2px var(--dimacc)}
  .wd.on.today{box-shadow:0 0 0 2px var(--soft)}
  .wk-sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:9px}
  /* toggle segmentato (metrica grafico) */
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{font-family:var(--mono);font-size:12px;color:var(--ink-dim);padding:7px 13px;border-radius:7px;min-height:38px;transition:.15s var(--ease)}
  .seg button.on{background:var(--accent);color:#1a0d03;font-weight:700}
  /* calcolo dischi */
  .pc-out{margin-top:4px}
  .pc-line{font-family:var(--mono);font-size:13px;color:var(--ink-dim);margin-bottom:10px}
  .pc-line b{color:var(--ink);font-size:15px}
  .plate-row{display:flex;flex-wrap:wrap;gap:8px}
  .plate{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ink);
    min-width:46px;text-align:center;padding:10px 6px;border-radius:9px;
    background:var(--panel-3);border:1px solid var(--dimacc);box-shadow:inset 0 0 0 1px rgba(255,106,26,.08)}
  .chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-faint)}
  .chk{transition:background .2s var(--ease),border-color .2s var(--ease)}
  .chk.on{background:var(--green);border-color:var(--green);color:#12271a}
  .chk.on{animation:pop .3s var(--ease)}
  .set-row{transition:background .3s var(--ease)}
  .set-row.done{background:linear-gradient(0deg,rgba(123,216,143,.07),transparent)}
  .set-actions{display:flex;gap:8px;padding:6px 14px 14px}
  .note-in{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:9px 10px;font-size:13px;margin:2px 14px 12px;width:calc(100% - 28px)}
  .setnote-btn{width:30px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink-faint);font-size:13px;display:flex;align-items:center;justify-content:center;transition:color .2s var(--ease),border-color .2s var(--ease)}
  .setnote-btn.has{color:var(--accent-soft);border-color:var(--accent-dim)}
  .setnote{grid-column:1/-1;margin-top:6px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;font-size:13px;width:100%}
  .setnote:focus{outline:none;border-color:var(--accent)}
  .ex-head .nm .hint{font-size:12px;color:var(--ink-faint);margin-top:4px;font-style:italic;line-height:1.3}
  .tag-fail{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--red);border:1px solid #4a2a27;border-radius:99px;padding:2px 7px;vertical-align:middle;white-space:nowrap}
  .ss-group{border:1px dashed var(--accent-dim);border-radius:16px;padding:10px 10px 2px;margin-bottom:12px;
    background:rgba(255,106,26,.035)}
  .ss-head{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent-soft);padding:2px 4px 9px}
  .ss-group .ex-card{margin-bottom:8px;background:var(--panel-2)}

  /* rest timer overlay */
  .rest{position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:16px 16px calc(16px + var(--safe-b));background:linear-gradient(0deg,var(--panel-3),var(--panel));
    border-top:1px solid var(--accent-dim);box-shadow:0 -10px 30px rgba(0,0,0,.4);
    transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .rest.show{transform:none}
  .rest .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rest .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft)}
  .rest .time{font-family:var(--mono);font-weight:700;font-size:42px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .rest .time.warn{color:var(--accent);text-shadow:0 0 22px rgba(255,106,26,.5);animation:pulse 1s var(--ease) infinite}
  .rest .bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .rest .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}
  .rest .ctr{display:flex;gap:8px}

  /* modal / sheet */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;
    background:var(--panel-2);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:8px 16px calc(20px + var(--safe-b));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:88vh;overflow-y:auto}
  .sheet.show{transform:none}
  .sheet .grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 14px}
  .sheet h3{font-family:var(--display);text-transform:uppercase;font-size:22px;margin-bottom:14px}
  .sheet-msg{color:var(--ink-dim);font-size:14px;line-height:1.5;margin:-4px 0 16px}
  .sheet-item{display:flex;align-items:center;gap:12px;width:100%;padding:15px 4px;font-size:16px;
    border-bottom:1px solid var(--line-soft);text-align:left}
  .sheet-item:last-child{border-bottom:none}
  .sheet-item .ic{width:22px;text-align:center;font-size:18px}
  .sheet-item.danger{color:var(--red)}

  /* form fields */
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:13px 12px;font-size:16px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .field .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  /* editor list */
  .ed-ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:10px}
  .ed-ex .r1{display:flex;align-items:center;gap:8px}
  .ed-ex .r1 .name{flex:1;font-weight:600;font-size:16px}
  .ed-ex .r2{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-top:4px}
  .ord{display:flex;flex-direction:column;gap:2px}
  .ord button{width:34px;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:12px}

  /* history */
  .hist{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .hist .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .hist .h .d{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
  .hist .h .when{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:auto}
  .hist .h .log-pr{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.02em;
    color:var(--accent);background:rgba(255,106,26,.12);border:1px solid var(--dimacc);
    border-radius:6px;padding:2px 7px;align-self:center}
  .hist .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:4px}
  .hist .meta .cid{color:var(--ink-faint);opacity:.75;margin-right:2px}
  .hist .meta.vol{margin-top:1px;color:var(--ink-faint)}
  .hist .det{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;display:none}
  .hist.open .det{display:block}
  .hist .de{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-dim)}
  .hist .de b{color:var(--ink);font-weight:600}
  .hist .de-note{font-size:12px;color:var(--ink-faint);font-style:italic;padding:1px 0 3px 2px}

  /* charts */
  .chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .chart-wrap .ct{font-family:var(--display);text-transform:uppercase;font-size:16px;margin-bottom:2px}
  .chart-wrap .cs{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:10px}
  svg.chart{width:100%;height:auto;display:block}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{height:0;display:none}
  .chip{transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
  .chip{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
    font-size:13px;font-weight:600;color:var(--ink-dim)}
  .chip.on{background:var(--accent);color:#1a1109;border-color:transparent}

  /* empty */
  .empty{text-align:center;padding:44px 20px;color:var(--ink-faint)}
  .empty .ic{font-size:38px;margin-bottom:10px;opacity:.6}
  .empty p{font-size:14px}

  /* bottom nav */
  .tabbar{position:relative;display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(23,20,17,.62);border-top:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    padding-bottom:var(--safe-b);touch-action:pan-x;user-select:none;-webkit-user-select:none}
  .tabbar button{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 9px;color:var(--ink-faint);font-size:10px;font-family:var(--mono);letter-spacing:.05em;transition:color .2s var(--ease)}
  .tabbar button .ti{font-size:19px;line-height:1;transition:transform .28s var(--spring)}
  .tabbar button.on{color:var(--accent)}
  .tabbar button.on .ti{transform:translateY(-1px) scale(1.08)}
  .tabbar button.hot{color:var(--ink)}            /* voce sotto il dito mentre trascini */
  .tabbar button.hot .ti{transform:translateY(-2px) scale(1.14)}
  /* pillola di vetro: scivola sotto le voci e segue il dito */
  .pill{position:absolute;z-index:1;top:5px;bottom:calc(5px + var(--safe-b));left:0;width:25%;
    border-radius:14px;pointer-events:none;
    background:linear-gradient(150deg, rgba(255,255,255,.15), rgba(255,170,110,.05) 46%, rgba(255,106,26,.13));
    backdrop-filter:blur(20px) saturate(200%) brightness(1.1);
    -webkit-backdrop-filter:blur(20px) saturate(200%) brightness(1.1);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.36), inset 0 -1px 0 rgba(255,179,122,.14),
               0 10px 22px -12px rgba(0,0,0,.85), 0 0 18px -6px rgba(255,106,26,.3);
    transition:transform .38s var(--spring), opacity .22s var(--ease)}
  .pill::after{content:"";position:absolute;inset:1px 1px auto 1px;height:42%;
    border-radius:13px 13px 40% 40%;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.2), transparent)}
  .pill.off{opacity:0}                            /* schermate fuori dalle 4 voci */
  .tabbar.dragging .pill{transition:transform .07s linear, opacity .22s var(--ease);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.46), inset 0 -1px 0 rgba(255,179,122,.2),
               0 12px 26px -12px rgba(0,0,0,.9), 0 0 26px -6px rgba(255,106,26,.45)}
  .pill.instant{transition:none}                  /* primo posizionamento: nessun volo */

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(var(--navh) + 22px);transform:translateX(-50%) translateY(20px);
    background:var(--panel-3);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14px;
    z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%)}

  .hidden{display:none!important}
</style>
</head>
<body>
<div id="shell">
  <main id="app"></main>
  <div id="navwrap"></div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ============ VIEWPORT REALE (fix "blocco nero" sotto il tabbar su Safari iOS) ============ */
// bug WebKit noto: un elemento position:fixed segue il visual viewport, ma quando
// la barra indirizzi di Safari si nasconde/mostra scrollando il CSS puro (dvh
// incluso) a volte non si riallinea da solo. Si traccia il viewport reale a mano
// e si scrive in --vvh, che vince su bottom:0 nelle regole di over-constraint.
function syncViewportHeight(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--vvh", h+"px");
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", syncViewportHeight);
  visualViewport.addEventListener("scroll", syncViewportHeight);
}
window.addEventListener("resize", syncViewportHeight);
window.addEventListener("orientationchange", syncViewportHeight);
syncViewportHeight();

/* ============ STORAGE ============ */
const KEY = "gymapp:v2";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Date.now()+Math.random().toString(36).slice(2));

function defaultSchema(){
  // ex(nome, serie, repMin, repMax, rir, recuperoSec, opzioni)
  // opzioni: {hint, failLast, ss, bilateral} - ss = id gruppo superset (esercizi consecutivi con lo stesso ss)
  // bilateral: true = esercizio con 2 manubri contemporaneamente, il kg inserito e' di UN manubrio
  // e il volume (kg*reps) va raddoppiato. NON tocca il carico mostrato in PR/grafici, solo il volume totale.
  const ex = (name, sets, rl, rh, rir, rest, o={}) => ({
    id:uid(), name, note:o.hint||"", sets, repsLow:rl, repsHigh:rh, rir, restSec:rest,
    failLast:!!o.failLast, ss:o.ss||null, bilateral:!!o.bilateral
  });
  return {
    rotationIndex: 0,
    days: [
      { id:uid(), name:"Spinta A", focus:"Petto", exercises:[
        ex("Panca piana bilanciere",4,6,8,"1-2",150,{hint:"presa poco piu' larga delle spalle"}),
        ex("Panca inclinata manubri (30°)",3,8,10,"1-2",120,{bilateral:true}),
        ex("Croci ai cavi in piedi",3,8,12,"0-1",90,{hint:"gomiti morbidi, arco ampio e controllato, zero stress sulla spalla in fondo",failLast:true}),
        ex("Alzate laterali manubri",3,12,15,"0-1",60,{bilateral:true}),
        ex("Pushdown ai cavi (corda)",3,10,12,"0-1",0,{ss:"t1",failLast:true}),
        ex("French press EZ (o manubrio)",3,10,12,"0-1",75,{ss:"t1",failLast:true}),
      ]},
      { id:uid(), name:"Tirata A", focus:"Schiena + bicipiti", exercises:[
        ex("Lat machine presa larga",4,6,8,"1-2",150,{hint:"tirare verso lo sterno, gomiti in basso"}),
        ex("Rematore bilanciere",3,8,10,"2",120),
        ex("Pulley basso presa stretta",3,10,12,"1",90),
        ex("Curl bilanciere EZ",3,8,12,"0-1",0,{ss:"b1",failLast:true}),
        ex("Curl martello manubri",3,8,12,"0-1",75,{ss:"b1",failLast:true,bilateral:true}),
        ex("Curl ai cavi (o panca Scott)",2,12,15,"0",60,{hint:"picco bicipite",failLast:true}),
      ]},
      { id:uid(), name:"Spinta B", focus:"Spalle + braccia", exercises:[
        ex("Lento avanti manubri",4,6,8,"1-2",150,{hint:"variante manubri, piu' gentile sulle spalle della bilanciere",bilateral:true}),
        ex("Alzate laterali manubri",4,12,15,"0",60,{hint:"priorita': spalle larghe",failLast:true,bilateral:true}),
        ex("Alzate posteriori (rear delt)",3,15,15,"0-1",0,{ss:"s3",failLast:true}),
        ex("Alzate laterali ai cavi",3,15,15,"0",75,{ss:"s3",failLast:true}),
        ex("Curl manubri alternato",3,10,12,"0-1",0,{ss:"arm1",failLast:true,bilateral:true}),
        ex("Pushdown corda ai cavi",3,10,12,"0",75,{ss:"arm1",failLast:true}),
        ex("Curl concentrato",2,10,12,"0",0,{ss:"arm2",failLast:true}),
        ex("Kickback ai cavi",2,12,15,"0",60,{ss:"arm2",failLast:true}),
      ]},
      { id:uid(), name:"Gambe", focus:"Gambe + upper", exercises:[
        ex("Pressa",4,8,10,"1-2",120,{hint:"quadricipiti + glutei, il main lift della giornata"}),
        ex("Hack squat",3,8,10,"1-2",120,{hint:"quadricipiti, enfasi separazione"}),
        ex("Leg extension",3,12,15,"0-1",75,{hint:"quadricipiti - definizione",failLast:true}),
        ex("Leg curl sdraiato",3,12,15,"0-1",75,{hint:"femorali, bilancia il lavoro quad",failLast:true}),
        ex("Hip thrust bilanciere",3,10,12,"1",90,{hint:"glutei/femorali anti-strappo"}),
        ex("Polpacci in piedi",4,12,15,"1",0,{ss:"leg1",hint:"propedeutico corsa"}),
        ex("Tibiale (tibialis raise)",3,15,20,"1",60,{ss:"leg1",hint:"anti-shin splint"}),
        ex("Chest press (macchina)",3,10,12,"1",90,{hint:"secondo tocco settimanale per il petto, angolo diverso dalla panca"}),
        ex("Rematore al cavo",3,10,12,"1",90,{hint:"secondo tocco settimanale per la schiena"}),
      ]},
    ]
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return { schema:defaultSchema(), sessions:[], bodyweight:[], active:null };
    const d = JSON.parse(raw);
    d.schema  = d.schema  || defaultSchema();
    d.sessions = d.sessions || [];
    d.bodyweight = d.bodyweight || [];
    d.active = d.active || null;
    return d;
  }catch(e){
    // niente fallback silenzioso: avviso e riparto pulito ma conservo il vecchio
    console.error("Dati corrotti:", e);
    alert("Attenzione: i dati salvati erano illeggibili. Riparto da una scheda nuova; il vecchio salvataggio resta nel backup del browser.");
    return { schema:defaultSchema(), sessions:[], bodyweight:[], active:null };
  }
}
let DB = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

// Migrazione una-volta-sola: le trazioni escono dalla scheda (anche da quella
// gia' salvata sul telefono) e diventano lat machine. Lo storico non si tocca.
function migrateNoPullups(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.noPullups) return 0;
  let n=0;
  DB.schema.days.forEach(d=>d.exercises.forEach(e=>{
    if(!/trazion/i.test(e.name)) return;
    e.name = "Lat machine presa larga";
    if(/assistit|elastico/i.test(e.note||"")) e.note = "tirare verso lo sterno, gomiti in basso";
    n++;
  }));
  if(DB.active) DB.active.entries.forEach(e=>{
    if(/trazion/i.test(e.name)){ e.name="Lat machine presa larga"; n++; }
  });
  DB.migrations.noPullups = true;
  save();
  return n;
}

// Migrazione una-volta-sola: sostituisce le croci ai cavi con i dip petto in
// "Spinta A" (piu' efficaci sul pettorale, per chi ha gia' salvato la scheda sul
// telefono) e aggiunge Leg extension in "Tirata B" (lavoro quadricipiti). Lo storico non si tocca.
function migrateChestDipsAndLegs(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.chestDipsLegs) return 0;
  let n=0;
  DB.schema.days.forEach(d=>{
    d.exercises.forEach(e=>{
      if(/croci ai cavi altezza media/i.test(e.name)){
        e.name="Dips alle parallele (petto)";
        e.note="busto inclinato avanti, gomiti larghi, scendi fino a stretch - fermati se senti la spalla";
        e.rir="0-1"; e.restSec=90; e.repsLow=8; e.repsHigh=12; e.failLast=true;
        n++;
      }
    });
    if(d.name==="Tirata B" && !d.exercises.some(e=>/leg extension/i.test(e.name))){
      d.exercises.push({ id:uid(), name:"Leg extension", note:"quadricipiti - definizione, propedeutico corsa",
        sets:3, repsLow:12, repsHigh:15, rir:"0-1", restSec:75, failLast:false, ss:null });
      n++;
    }
  });
  if(DB.active) DB.active.entries.forEach(e=>{
    if(/croci ai cavi altezza media/i.test(e.name)){
      e.name="Dips alle parallele (petto)";
      e.hint="busto inclinato avanti, gomiti larghi, scendi fino a stretch - fermati se senti la spalla";
      n++;
    }
  });
  DB.migrations.chestDipsLegs = true;
  save();
  return n;
}

// Migrazione una-volta-sola: ristruttura la scheda da 4 giorni push/pull con
// gambe in coda a 3 giorni upper puri + 1 giorno gambe dedicato (macchine,
// piu' due esercizi upper per non perdere frequenza su petto/schiena). Sostituisce
// solo la scheda (DB.schema.days): storico sessioni e sessione attiva non si toccano.
function migrateUpperLegsSplit(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.upperLegsSplitV3) return 0;
  const E = (name, sets, rl, rh, rir, rest, o={}) => ({
    id:uid(), name, note:o.hint||"", sets, repsLow:rl, repsHigh:rh, rir, restSec:rest,
    failLast:!!o.failLast, ss:o.ss||null, bilateral:!!o.bilateral
  });
  DB.schema.days = [
    { id:uid(), name:"Spinta A", focus:"Petto", exercises:[
      E("Panca piana bilanciere",4,6,8,"1-2",150,{hint:"presa poco piu' larga delle spalle"}),
      E("Panca inclinata manubri (30°)",3,8,10,"1-2",120,{bilateral:true}),
      E("Croci ai cavi in piedi",3,8,12,"0-1",90,{hint:"gomiti morbidi, arco ampio e controllato, zero stress sulla spalla in fondo",failLast:true}),
      E("Alzate laterali manubri",3,12,15,"0-1",60,{bilateral:true}),
      E("Pushdown ai cavi (corda)",3,10,12,"0-1",0,{ss:"t1",failLast:true}),
      E("French press EZ (o manubrio)",3,10,12,"0-1",75,{ss:"t1",failLast:true}),
    ]},
    { id:uid(), name:"Tirata A", focus:"Schiena + bicipiti", exercises:[
      E("Lat machine presa larga",4,6,8,"1-2",150,{hint:"tirare verso lo sterno, gomiti in basso"}),
      E("Rematore bilanciere",3,8,10,"2",120),
      E("Pulley basso presa stretta",3,10,12,"1",90),
      E("Curl bilanciere EZ",3,8,12,"0-1",0,{ss:"b1",failLast:true}),
      E("Curl martello manubri",3,8,12,"0-1",75,{ss:"b1",failLast:true,bilateral:true}),
      E("Curl ai cavi (o panca Scott)",2,12,15,"0",60,{hint:"picco bicipite",failLast:true}),
    ]},
    { id:uid(), name:"Spinta B", focus:"Spalle + braccia", exercises:[
      E("Lento avanti manubri",4,6,8,"1-2",150,{hint:"variante manubri, piu' gentile sulle spalle della bilanciere",bilateral:true}),
      E("Alzate laterali manubri",4,12,15,"0",60,{hint:"priorita': spalle larghe",failLast:true,bilateral:true}),
      E("Alzate posteriori (rear delt)",3,15,15,"0-1",0,{ss:"s3",failLast:true}),
      E("Alzate laterali ai cavi",3,15,15,"0",75,{ss:"s3",failLast:true}),
      E("Curl manubri alternato",3,10,12,"0-1",0,{ss:"arm1",failLast:true,bilateral:true}),
      E("Pushdown corda ai cavi",3,10,12,"0",75,{ss:"arm1",failLast:true}),
      E("Curl concentrato",2,10,12,"0",0,{ss:"arm2",failLast:true}),
      E("Kickback ai cavi",2,12,15,"0",60,{ss:"arm2",failLast:true}),
    ]},
    { id:uid(), name:"Gambe", focus:"Gambe + upper", exercises:[
      E("Pressa",4,8,10,"1-2",120,{hint:"quadricipiti + glutei, il main lift della giornata"}),
      E("Hack squat",3,8,10,"1-2",120,{hint:"quadricipiti, enfasi separazione"}),
      E("Leg extension",3,12,15,"0-1",75,{hint:"quadricipiti - definizione",failLast:true}),
      E("Leg curl sdraiato",3,12,15,"0-1",75,{hint:"femorali, bilancia il lavoro quad",failLast:true}),
      E("Hip thrust bilanciere",3,10,12,"1",90,{hint:"glutei/femorali anti-strappo"}),
      E("Polpacci in piedi",4,12,15,"1",0,{ss:"leg1",hint:"propedeutico corsa"}),
      E("Tibiale (tibialis raise)",3,15,20,"1",60,{ss:"leg1",hint:"anti-shin splint"}),
      E("Chest press (macchina)",3,10,12,"1",90,{hint:"secondo tocco settimanale per il petto, angolo diverso dalla panca"}),
      E("Rematore al cavo",3,10,12,"1",90,{hint:"secondo tocco settimanale per la schiena"}),
    ]},
  ];
  DB.migrations.upperLegsSplitV3 = true;
  save();
  return 1;
}

// Migrazione una-volta-sola: (1) segna "bilateral" sugli esercizi con 2 manubri
// contemporaneamente, cosi' il volume (kg*reps) li conta doppi - il carico
// mostrato in PR/grafici resta quello di un manubrio, invariato; (2) sostituisce
// i Dip petto in Spinta A con Croci ai cavi in piedi (zero stress sulla spalla
// in fondo al movimento). Lo storico non si tocca.
function migrateBilateralAndChestSwap(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.bilateralChestSwap) return 0;
  let n=0;
  const BILATERAL_NAMES = new Set([
    "Panca inclinata manubri (30°)", "Alzate laterali manubri",
    "Curl martello manubri", "Lento avanti manubri", "Curl manubri alternato",
  ]);
  DB.schema.days.forEach(d=>{
    d.exercises.forEach(e=>{
      if(BILATERAL_NAMES.has(e.name) && !e.bilateral){ e.bilateral=true; n++; }
      if(/^dips alle parallele \(petto\)$/i.test(e.name)){
        e.name="Croci ai cavi in piedi";
        e.note="gomiti morbidi, arco ampio e controllato, zero stress sulla spalla in fondo";
        n++;
      }
    });
  });
  if(DB.active) DB.active.entries.forEach(e=>{
    if(BILATERAL_NAMES.has(e.name) && !e.bilateral){ e.bilateral=true; n++; }
    if(/^dips alle parallele \(petto\)$/i.test(e.name)){ e.name="Croci ai cavi in piedi"; n++; }
  });
  DB.migrations.bilateralChestSwap = true;
  save();
  return n;
}

// Migrazione una-volta-sola: 45 min reali con 19 serie = ~2.4 min/serie (rest+esecuzione).
// Per arrivare davvero a 75-90 min servono ~32-38 serie a giornata: tutte e 4 le giornate
// erano sotto quella soglia (19/18/24/29 serie), non solo le due piu' corte. Aggiunge
// esercizi mirati su angoli/muscoli non ancora coperti in ciascuna giornata - portando
// tutte e 4 a ~34 serie (~80 min) - evitando doppioni tra Spinta A e Spinta B.
// Usa l'indice del giorno (creato in ordine fisso da migrateUpperLegsSplit), non il nome:
// un rinomina dalla UI non deve impedire alla migrazione di applicarsi.
function migrateAddVolumeV4(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.addVolumeV4) return 0;
  const E = (name, sets, rl, rh, rir, rest, o={}) => ({
    id:uid(), name, note:o.hint||"", sets, repsLow:rl, repsHigh:rh, rir, restSec:rest,
    failLast:!!o.failLast, ss:o.ss||null, bilateral:!!o.bilateral
  });
  const days = DB.schema.days;
  if(days.length<4) return 0;
  let n=0;
  const [spintaA, tirataA, spintaB, gambe] = days;

  // Spinta A (petto): niente terze/quarte varianti di panca piana (dip, manubri,
  // presa stretta erano tutte la stessa spinta orizzontale gia' coperta dal bilanciere -
  // volume senza stimolo nuovo). Al loro posto: due macchine (chest press a convergenza,
  // pec deck) per allenare a cedimento in sicurezza senza stabilizzatori extra, un angolo
  // in declino - l'unico mancante tra piatta/inclinata/declinata - una fly inclinata che
  // isola il petto alto (la panca inclinata gia' presente e' un compound, non un'isolazione),
  // e un push-up a zavorra come variante compound a corpo libero di chiusura. Niente
  // alzate/spalle: restano su Spinta B per non duplicare lavoro nella stessa settimana.
  if(!spintaA.exercises.some(e=>e.name==="Chest press a convergenza (macchina)")){
    spintaA.exercises.push(
      E("Chest press a convergenza (macchina)",3,8,10,"1-2",100,{hint:"spinta orizzontale a macchina, stabilita' garantita: si spinge a cedimento senza rischio"}),
      E("Pec deck (croci a macchina)",3,10,12,"0-1",75,{hint:"isolamento petto con curva di resistenza a camma, diversa dai cavi",failLast:true}),
      E("Panca declinata (bilanciere o Smith)",3,8,10,"1-2",120,{hint:"petto basso, unico angolo in declino della giornata"}),
      E("Croci manubri su panca inclinata (30°)",3,10,12,"0-1",90,{hint:"petto alto in isolamento - completa la panca inclinata, che e' un compound",bilateral:true,failLast:true}),
      E("Push-up a zavorra (o su parallele con disco)",3,10,15,"1",90,{hint:"compound a corpo libero di chiusura, stabilita' extra rispetto alle macchine"}),
    );
    n+=5;
  }

  // Tirata A (schiena+bicipiti): rematore unilaterale per lo spessore, lat machine
  // neutra per un angolo di presa diverso, pullover per il piano verticale (unico
  // tra le tirate), scrollate per i trapezi (zero lavoro diretto finora), curl
  // inverso per gli avambracci (idem).
  if(!tirataA.exercises.some(e=>e.name==="Rematore manubrio unilaterale")){
    tirataA.exercises.push(
      E("Rematore manubrio unilaterale",4,8,10,"1-2",90,{hint:"spessore schiena, lavoro unilaterale con supporto su panca"}),
      E("Lat machine presa neutra",3,8,10,"1-2",90,{hint:"larghezza dorsale, angolo di presa diverso dalla presa larga"}),
      E("Pull-over ai cavi",3,10,12,"0-1",75,{hint:"unico tirata sul piano verticale, stretch del gran dorsale",failLast:true}),
      E("Scrollate (shrugs) con bilanciere",3,10,12,"0-1",60,{hint:"trapezio, nessun lavoro diretto finora"}),
      E("Curl inverso bilanciere EZ",3,10,12,"0-1",60,{hint:"avambracci/brachioradiale, nessun lavoro diretto finora",failLast:true}),
    );
    n+=5;
  }

  // Spinta B (spalle+braccia): alzate frontali per il delt anteriore isolato (finora
  // solo indiretto dal lento avanti), curl martello ai cavi per un angolo diverso dal
  // curl manubri, skull crusher per un'estensione tricipiti sdraiata (finora solo cavi).
  // Rinomina anche "Pushdown corda ai cavi": era identico, stesso nome e stessa presa,
  // all'esercizio gia' presente su Spinta A - qui passa alla barra V per un'impugnatura
  // diversa (piu' supinata, coinvolge diversamente il capo laterale), non piu' un doppione.
  spintaB.exercises.forEach(e=>{
    if(e.name==="Pushdown corda ai cavi"){
      e.name="Tricipiti al cavo con barra a V";
      e.note="presa piu' stretta e supinata della corda: stessa serie di Spinta A ma stimolo diverso";
    }
  });
  if(!spintaB.exercises.some(e=>e.name==="Alzate frontali con disco")){
    spintaB.exercises.push(
      E("Alzate frontali con disco",4,12,15,"0-1",60,{hint:"delt anteriore isolato, prima solo indiretto dal lento avanti",failLast:true}),
      E("Curl martello ai cavi (corda)",3,10,12,"0-1",60,{hint:"brachiale, angolo diverso dal curl manubri",failLast:true}),
      E("Estensioni tricipiti sdraiato (skull crusher) manubri",3,10,12,"0-1",75,{hint:"tricipiti sdraiato, prima solo lavoro ai cavi",failLast:true}),
    );
    n+=3;
  }

  // Gambe: leg curl seduto per un angolo diverso dal femorale sdraiato gia' presente,
  // adduttore/abduttore per gli stabilizzatori dell'anca, zero lavoro diretto finora.
  if(!gambe.exercises.some(e=>e.name==="Leg curl seduto")){
    gambe.exercises.push(
      E("Leg curl seduto",3,12,15,"0-1",75,{hint:"femorale, angolo diverso dal leg curl sdraiato",failLast:true}),
      E("Adduttore/Abduttore macchina",2,15,15,"0",60,{hint:"stabilizzatori dell'anca, nessun lavoro diretto finora",failLast:true}),
    );
    n+=2;
  }

  DB.migrations.addVolumeV4 = true;
  save();
  return n;
}

// Migrazione una-volta-sola: la V4 aggiungeva i nuovi esercizi in coda con .push(),
// senza pensare all'ordine di esecuzione - i compound pesanti finivano dopo le
// isolazioni. Qui si riordina ogni giornata: compound piu' pesanti prima, poi
// compound piu' leggeri/a macchina, poi isolazioni, poi eventuali braccia/accessori
// in fondo. Le coppie in superserie (stesso campo ss) restano adiacenti per forza -
// il raggruppamento visivo in sessione dipende dall'adiacenza nell'array, non dal
// campo ss da solo. Gira ANCHE se un dispositivo ha gia' applicato la V4 in un
// ordine sbagliato (idempotente: si limita a riordinare per nome).
function migrateReorderV5(){
  DB.migrations = DB.migrations || {};
  if(DB.migrations.reorderV5) return 0;
  const orderByDay = {
    "Spinta A": ["Panca piana bilanciere","Panca declinata (bilanciere o Smith)","Panca inclinata manubri (30°)","Chest press a convergenza (macchina)","Croci ai cavi in piedi","Croci manubri su panca inclinata (30°)","Pec deck (croci a macchina)","Push-up a zavorra (o su parallele con disco)","Alzate laterali manubri","Pushdown ai cavi (corda)","French press EZ (o manubrio)"],
    "Tirata A": ["Lat machine presa larga","Rematore bilanciere","Rematore manubrio unilaterale","Lat machine presa neutra","Pulley basso presa stretta","Pull-over ai cavi","Scrollate (shrugs) con bilanciere","Curl bilanciere EZ","Curl martello manubri","Curl ai cavi (o panca Scott)","Curl inverso bilanciere EZ"],
    "Spinta B": ["Lento avanti manubri","Alzate frontali con disco","Alzate laterali manubri","Alzate posteriori (rear delt)","Alzate laterali ai cavi","Curl manubri alternato","Tricipiti al cavo con barra a V","Curl martello ai cavi (corda)","Estensioni tricipiti sdraiato (skull crusher) manubri","Curl concentrato","Kickback ai cavi"],
    "Gambe": ["Pressa","Hack squat","Leg extension","Leg curl sdraiato","Leg curl seduto","Hip thrust bilanciere","Adduttore/Abduttore macchina","Polpacci in piedi","Tibiale (tibialis raise)","Chest press (macchina)","Rematore al cavo"],
  };
  let n=0;
  DB.schema.days.forEach(d=>{
    const order = orderByDay[d.name];
    if(!order) return;
    const before = d.exercises.map(e=>e.name).join("|");
    d.exercises.sort((a,b)=>{
      const ia=order.indexOf(a.name), ib=order.indexOf(b.name);
      return (ia<0?999:ia)-(ib<0?999:ib);
    });
    if(d.exercises.map(e=>e.name).join("|")!==before) n++;
  });
  DB.migrations.reorderV5 = true;
  save();
  return n;
}

function fmtDur(sec){ const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0"); }
function dayLabel(iso){
  const d=new Date(iso), now=new Date();
  const days=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"], mesi=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  const same=d.toDateString()===now.toDateString();
  const yst=new Date(now); yst.setDate(now.getDate()-1);
  if(same) return "Oggi";
  if(d.toDateString()===yst.toDateString()) return "Ieri";
  return days[d.getDay()]+" "+d.getDate()+" "+mesi[d.getMonth()];
}
function repsTarget(e){ return e.repsLow===e.repsHigh ? e.repsLow : e.repsLow+"-"+e.repsHigh; }

// trova l'ultima performance registrata di un esercizio (per exId, con fallback sul nome
// se l'id non combacia piu' - es. dopo una ristrutturazione della scheda che rigenera gli id),
// esclusi skip
function lastPerf(exId, beforeSessionId, exName){
  for(let i=DB.sessions.length-1;i>=0;i--){
    const s=DB.sessions[i];
    if(beforeSessionId && s.id===beforeSessionId) continue;
    let en=s.entries.find(x=>x.exId===exId && !x.skipped && x.sets.some(st=>st.kg||st.reps));
    if(!en && exName) en=s.entries.find(x=>x.name===exName && !x.skipped && x.sets.some(st=>st.kg||st.reps));
    if(en) return {date:s.date, sets:en.sets.filter(st=>st.kg||st.reps)};
  }
  return null;
}

// miglior peso storico (kg) di un esercizio, contando solo serie con kg e reps validi.
// excludeSessionId: salta una sessione (usato per confrontare "prima di oggi").
function bestWeight(exId, excludeSessionId){
  let best=0;
  for(const s of DB.sessions){
    if(excludeSessionId && s.id===excludeSessionId) continue;
    const en=s.entries.find(x=>x.exId===exId && !x.skipped);
    if(!en) continue;
    for(const st of en.sets){
      const kg=parseFloat(st.kg), r=parseInt(st.reps,10);
      if(kg>0 && r>0 && kg>best) best=kg;
    }
  }
  return best;
}
// massimo peso "buono" (kg con reps) in un elenco di serie dell'entry corrente
function entryTopWeight(entry){
  let cur=0;
  for(const s of entry.sets){
    if(!setCounted(s)) continue;   // una serie precompilata ma mai toccata non vale
    const kg=parseFloat(s.kg), r=parseInt(s.reps,10); if(kg>0&&r>0&&kg>cur)cur=kg;
  }
  return cur;
}
// volume (kg*reps) di una serie, raddoppiato se l'esercizio e' bilateral (2 manubri contemporaneamente)
function setVolume(s, bilateral){ return (+s.kg||0)*(+s.reps||0)*(bilateral?2:1); }

/* ============ AUDIO / VIBRAZIONE ============ */
let AC=null;
function beep(times=1){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    let t=AC.currentTime;
    for(let i=0;i<times;i++){
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t); o.stop(t+0.24); t+=0.3;
    }
  }catch(e){ /* audio non disponibile: pazienza, resta la parte visiva */ }
  if(navigator.vibrate) navigator.vibrate(times>1?[120,80,120]:200);
}
// sblocca audio al primo tocco (iOS lo richiede)
document.addEventListener("touchstart", function unlock(){ try{ AC=AC||new(window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){} document.removeEventListener("touchstart",unlock); }, {once:true});

/* ============ STATE / ROUTER ============ */
// se c'era una sessione in corso (chiusura per sbaglio, ricarica, riavvio della PWA)
// si riapre direttamente li': mai piu' home come schermata di partenza in quel caso.
let view = DB.active ? "session" : "home";
let viewArg = null;
let chartExId = null;
let chartMetric = "top";   // 'top' = carico max · 'e1rm' = 1RM stimato

// le 4 voci del tabbar, in ordine: servono anche allo swipe orizzontale
const TABS = ["home","history","charts","weight"];
// cronologia interna: ogni voce e' una schermata. L'indice viene messo anche in
// history.state, cosi' il tasto indietro del telefono torna dentro l'app.
let navStack = [{view, arg:null}];

// dir: undefined = entrata a cascata · "fwd" = entra da destra · "back" = entra da sinistra
function applyState(st, dir){
  // se la sessione non esiste piu' (finita/annullata) quella schermata non e' valida
  if(st.view==="session" && !DB.active) st={view:"home", arg:null};
  view=st.view; viewArg=st.arg??null;
  render();
  app.scrollTop=0;
  app.classList.remove("nav","slide-fwd","slide-back");
  void app.offsetWidth;                       // riavvia l'animazione anche a classe uguale
  app.classList.add(dir==="fwd"?"slide-fwd":dir==="back"?"slide-back":"nav");
  clearTimeout(applyState._t);
  applyState._t=setTimeout(()=>app.classList.remove("nav","slide-fwd","slide-back"), 650);
}

function go(v, arg, dir){
  if(v===view && (arg??null)===viewArg) return;
  navStack.push({view:v, arg:arg??null});
  history.pushState({i:navStack.length-1}, "");
  applyState(navStack[navStack.length-1], dir);
}
// indietro: passa sempre dal browser, cosi' un solo percorso gestisce bottone,
// gesture dal bordo e tasto indietro del telefono
function goBack(){
  if(navStack.length>1) history.back();
  else if(view!=="home") go("home", null, "back");
}
// azzera la cronologia interna (dopo fine/annullo sessione: quella schermata non esiste piu')
function resetTo(v, arg){
  navStack=[{view:v, arg:arg??null}];
  history.replaceState({i:0}, "");
  applyState(navStack[0]);
}
// cambio tab dal tabbar: direzione coerente con la posizione della voce
function goTab(v){
  const i=TABS.indexOf(view), j=TABS.indexOf(v);
  go(v, null, (i>=0&&j>=0) ? (j>i?"fwd":"back") : undefined);
}
window.addEventListener("popstate", e=>{
  const i = (e.state && typeof e.state.i==="number") ? e.state.i : 0;
  if(i>=navStack.length) return;              // avanti oltre cio' che conosciamo: ignoro
  navStack.length = i+1;
  applyState(navStack[i], "back");
});
history.replaceState({i:0}, "");

/* ============ GESTURE ============ */
// swipe orizzontale = cambia tab (anche trascinando sul tabbar)
// swipe che parte dal bordo sinistro = torna indietro
// Ignorati i gesti nati su campi di testo, liste che scrollano di lato e overlay.
let suppressClick=false;
document.addEventListener("click", e=>{
  if(!suppressClick) return;
  e.preventDefault(); e.stopPropagation();    // uno swipe non deve valere anche come tap
}, true);

(function initSwipe(){
  const EDGE=32, DIST=55, RATIO=1.6, MAXMS=800;
  let sx=0, sy=0, t0=0, tracking=false, fromEdge=false;
  // il tabbar ha il suo trascinamento dedicato (pillola di vetro): qui va escluso
  const skip = t => !!(t && t.closest && t.closest("input,textarea,select,.chip-row,.sheet,.rest,.tabbar"));
  document.addEventListener("touchstart", e=>{
    if(e.touches.length!==1 || skip(e.target)){ tracking=false; return; }
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY; t0=Date.now(); tracking=true; fromEdge=sx<=EDGE;
  }, {passive:true});
  document.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-t0>MAXMS) return;                             // troppo lento: era uno scroll
    if(Math.abs(dx)<DIST || Math.abs(dx)<Math.abs(dy)*RATIO) return;
    const done=()=>{ suppressClick=true; setTimeout(()=>suppressClick=false,450); };
    if(fromEdge && dx>0){ done(); goBack(); return; }
    if(view==="session") return;                                // in allenamento non si cambia per sbaglio
    const i=TABS.indexOf(view);
    if(i<0) return;                                             // editor & co: solo lo swipe indietro
    const j=i+(dx<0?1:-1);
    if(j<0||j>=TABS.length) return;
    done(); go(TABS[j], null, dx<0?"fwd":"back");
  }, {passive:true});
})();

/* ============ WAKELOCK ============ */
// Tiene lo schermo acceso durante la sessione. Il browser rilascia il sentinel
// quando la tab è nascosta → si riacquisisce con onVisible() al ritorno.
class ScreenWakeLock {
  constructor(){ this.sentinel=null; this.wanted=false; this._acquiring=false; }
  supported(){ return !!(navigator.wakeLock && typeof navigator.wakeLock.request==="function"); }
  async enable(){ this.wanted=true; await this._acquire(); }
  async disable(){
    this.wanted=false;
    if(this.sentinel){ try{ await this.sentinel.release(); }catch(_){} this.sentinel=null; }
  }
  async onVisible(){ if(this.wanted && !this.sentinel) await this._acquire(); }
  async _acquire(){
    if(!this.supported() || this.sentinel || this._acquiring) return;
    this._acquiring=true;
    try{
      this.sentinel=await navigator.wakeLock.request("screen");
      this.sentinel.addEventListener?.("release",()=>{ this.sentinel=null; });
    }catch(_){ this.sentinel=null; }   // rifiuta se tab non visibile / non permesso
    finally{ this._acquiring=false; }
  }
}
const wake = new ScreenWakeLock();

function nextDayIndex(){ return DB.schema.rotationIndex % DB.schema.days.length; }

function startSession(dayId){
  const day = DB.schema.days.find(d=>d.id===dayId);
  if(!day) return;
  // una sessione e' gia' aperta: toccare un giorno per errore non deve cancellarla in silenzio
  if(DB.active){
    confirmSheet("Hai gia' una sessione in corso",
      `Stai facendo "${esc(DB.active.dayName)}". Iniziare "${esc(day.name)}" cancella il progresso non salvato di quella sessione.`,
      {okLabel:"Sostituisci sessione", danger:true, onOk:()=>reallyStartSession(day)});
    return;
  }
  reallyStartSession(day);
}
function reallyStartSession(day){
  DB.active = {
    id:uid(), dayId:day.id, dayName:day.name, focus:day.focus,
    startTs: Date.now(), pausedTotal:0, pausedAt:null,
    entries: day.exercises.map(e=>{
      const lp=lastPerf(e.id, null, e.name);
      return {
        exId:e.id, name:e.name, hint:e.note||"", note:"", skipped:false,
        targetSets:e.sets, repsTarget:repsTarget(e), rir:e.rir, restSec:e.restSec,
        failLast:!!e.failLast, ss:e.ss||null, bilateral:!!e.bilateral,
        // precompila peso/reps con la sessione precedente: valore vero e modificabile.
        // "prefilled" resta true finche' non tocchi il campo o spunti la serie - vedi setVal/finishSession:
        // una serie prefillata mai toccata NON conta come fatta, una digitata a mano si' (anche senza spunta)
        sets: Array.from({length:e.sets},(_,si)=>({
          kg: (lp&&lp.sets[si]) ? String(lp.sets[si].kg||"") : "",
          reps: (lp&&lp.sets[si]) ? String(lp.sets[si].reps||"") : "",
          done:false, note:"", prefilled: !!(lp&&lp.sets[si])
        }))
      };
    })
  };
  save(); wake.enable(); go("session");
}
function finishSession(){
  const a=DB.active; if(!a) return;
  const dur = sessionElapsed();
  const sess = { id:a.id, dayId:a.dayId, dayName:a.dayName, date:new Date().toISOString(), durationSec:dur,
    entries:a.entries.map(e=>({exId:e.exId,name:e.name,skipped:e.skipped,note:e.note,bilateral:!!e.bilateral,
      // solo le serie "contate" finiscono nello storico: una serie precompilata dalla volta
      // scorsa ma mai toccata non conta come fatta, una digitata a mano si' (anche senza spunta)
      sets:e.sets.map(s=>({kg:setCounted(s)?s.kg:"",reps:setCounted(s)?s.reps:"",note:s.note||""}))})) };
  // rileva i record PRIMA di salvare la sessione (le sessioni attuali sono le "precedenti")
  const prs=[];
  a.entries.forEach(e=>{
    if(e.skipped) return;
    const cur=entryTopWeight(e); if(cur<=0) return;
    const prev=bestWeight(e.exId);        // storico senza la sessione di oggi
    if(prev>0 && cur>prev) prs.push({name:e.name, kg:cur, prev});
  });
  DB.sessions.push(sess);
  const di = DB.schema.days.findIndex(d=>d.id===a.dayId);
  if(di>=0) DB.schema.rotationIndex = (di+1)%DB.schema.days.length;
  DB.active=null; stopRest(); wake.disable();
  save();
  if(prs.length===1) toast(`🏆 Record: ${prs[0].name} ${prs[0].kg}kg (prima ${prs[0].prev})`);
  else if(prs.length>1) toast(`🏆 ${prs.length} nuovi record personali!`);
  else toast("Allenamento salvato ✓");
  resetTo("home");
}
function cancelSession(){
  DB.active=null; stopRest(); wake.disable(); save(); resetTo("home");
}

// timer ancorato a un timestamp reale (endTs): a schermo bloccato non deriva,
// al ritorno ricalcola il tempo vero e suona anche se l'intervallo era sospeso.
// endTs/total sono duplicati anche su DB.active cosi' un reload (chiusura per
// sbaglio, PWA riavviata dal telefono) non fa sparire il recupero in corso.
function restRemain(){ return rest.active ? Math.max(0,(rest.endTs-Date.now())/1000) : 0; }
function startRest(sec){
  stopRest();
  if(!sec || sec<=0){ return; }   // superset: nessuna pausa, si passa subito al prossimo
  rest={active:true, endTs:Date.now()+sec*1000, total:sec, warned10:false, warned3:false, warned2:false, warned1:false};
  if(DB.active){ DB.active.restEndTs=rest.endTs; DB.active.restTotal=rest.total; save(); }
  renderRest();
  restTimer=setInterval(tickRest,250);
}
// avviso a -10s, poi countdown 3-2-1 con un beep a testa, poi doppio beep al "via".
// ogni soglia suona una volta sola (flag dedicato) anche se il tick e' ogni 250ms.
function tickRest(){
  if(!rest.active){ return; }
  const remain=restRemain(), s=Math.ceil(remain);
  if(!rest.warned10 && remain<=10 && remain>3){ rest.warned10=true; beep(1); }
  if(!rest.warned3 && s===3){ rest.warned3=true; beep(1); }
  if(!rest.warned2 && s===2){ rest.warned2=true; beep(1); }
  if(!rest.warned1 && s===1){ rest.warned1=true; beep(1); }
  if(remain<=0){ beep(2); stopRest(); return; }
  renderRest();
}
function stopRest(){
  if(restTimer){clearInterval(restTimer);restTimer=null;}
  rest.active=false;
  if(DB.active && DB.active.restEndTs){ DB.active.restEndTs=null; DB.active.restTotal=null; save(); }
  renderRest();
}
// dopo un reload a meta' recupero: se DB.active ha ancora un endTs nel futuro, riparte da li'
function resumeRestIfAny(){
  const a=DB.active;
  if(!a || !a.restEndTs || a.restEndTs<=Date.now()) return;
  const remain=(a.restEndTs-Date.now())/1000;
  // le soglie gia' superate al momento del reload non risuonano in ritardo, solo quelle future
  rest={active:true, endTs:a.restEndTs, total:a.restTotal||Math.round(remain),
    warned10:remain>10, warned3:remain>3, warned2:remain>2, warned1:remain>1};
  renderRest();
  restTimer=setInterval(tickRest,250);
}
function renderRest(){
  let el=$("#rest");
  if(!el){ el=document.createElement("div"); el.id="rest"; el.className="rest"; document.body.appendChild(el); }
  if(!rest.active){ el.classList.remove("show"); return; }
  const remain=Math.round(restRemain());
  const pct = Math.max(0, remain/rest.total*100);
  el.innerHTML = `
    <div class="top">
      <span class="lbl">Recupero</span>
      <span class="time ${remain<=10?'warn':''}">${fmtDur(remain)}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="ctr">
      <button class="btn grow" onclick="adjRest(-15)">-15s</button>
      <button class="btn grow" onclick="adjRest(15)">+15s</button>
      <button class="btn accent grow" onclick="stopRest()">Salta</button>
    </div>`;
  el.classList.add("show");
}
function adjRest(d){
  if(!rest.active) return;
  rest.endTs += d*1000;
  const minEnd=Date.now()+1000;
  if(rest.endTs<minEnd) rest.endTs=minEnd;
  const newTotal=Math.round((rest.endTs-Date.now())/1000);
  if(newTotal>rest.total) rest.total=newTotal;   // barra non superi il 100%
  // se allunghi, ricalcola quali soglie sono ancora nel futuro (riabilita i beep passati oltre)
  if(d>0){
    const remain=(rest.endTs-Date.now())/1000;
    rest.warned10=remain<=10; rest.warned3=remain<=3; rest.warned2=remain<=2; rest.warned1=remain<=1;
  }
  if(DB.active){ DB.active.restEndTs=rest.endTs; DB.active.restTotal=rest.total; save(); }
  renderRest();
}
// al ritorno in primo piano ricalcola subito (schermo sbloccato / tab riattivata)
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ if(rest.active) tickRest(); wake.onVisible(); } });

/* ============ PAUSA CRONOMETRO SESSIONE ============ */
// il tempo passato in pausa non deve contare nella durata dell'allenamento
function sessionElapsed(){
  const a=DB.active; if(!a) return 0;
  const end = a.pausedAt || Date.now();
  return Math.max(0, Math.round((end-a.startTs-(a.pausedTotal||0))/1000));
}
function togglePauseSession(){
  const a=DB.active; if(!a) return;
  if(a.pausedAt){
    a.pausedTotal=(a.pausedTotal||0)+(Date.now()-a.pausedAt);
    a.pausedAt=null;
    ensureSessTimer();
  } else {
    a.pausedAt=Date.now();
    stopSessTimer();
  }
  save(); render();
}

/* ============ RENDER ROOT ============ */
function render(){

  else stopSessTimer();
  renderRest();
}
function ensureSessTimer(){ if(!sessTimer) sessTimer=setInterval(tickSession,1000); }
function stopSessTimer(){ if(sessTimer){clearInterval(sessTimer);sessTimer=null;} }
function tickSession(){
  if(!DB.active){ return; }
  const c=$("#sessClock"); if(c) c.firstChild.textContent = fmtDur(sessionElapsed());
}

/* ============ TABBAR ============ */
// Il tabbar viene creato UNA volta: cosi' la pillola di vetro puo' scivolare da
// una voce all'altra invece di ricomparire da capo a ogni cambio schermata.
const TAB_META = [
  ["home","\u{1F3CB}","Allena"],
  ["history","\u{1F4CB}","Storico"],
  ["charts","\u{1F4C8}","Grafici"],
  ["weight","⚖","Peso"],
];
function tabbarHTML(){
  return `<nav class="tabbar"><span class="pill instant"></span>`+
    TAB_META.map(([v,ic,lbl])=>`<button data-tab="${v}"><span class="ti">${ic}</span>${lbl}</button>`).join("")+
    `</nav>`;
}
function setNavH(){
  document.documentElement.style.setProperty("--navh", (navwrap.offsetHeight||0)+"px");
}
// posiziona la pillola sulla voce i (i<0 = schermata fuori dalle tab: la nasconde)
function placePill(i, instant){
  const bar=navwrap.querySelector(".tabbar"), pill=navwrap.querySelector(".pill");
  if(!bar||!pill) return;
  const slot=bar.getBoundingClientRect().width/TAB_META.length;
  pill.classList.toggle("off", i<0);
  if(i<0) return;
  if(instant) pill.classList.add("instant");
  pill.style.transform=`translateX(${slot*i}px)`;
  if(instant) requestAnimationFrame(()=>requestAnimationFrame(()=>pill.classList.remove("instant")));
}
function syncNav(){
  if(view==="session"){ navwrap.innerHTML=""; setNavH(); return; }
  const fresh = !navwrap.querySelector(".tabbar");
  if(fresh){ navwrap.innerHTML=tabbarHTML(); bindNavDrag(); }
  const i=TAB_META.findIndex(([v])=>v===view);
  navwrap.querySelectorAll(".tabbar button").forEach((b,k)=>{
    b.classList.toggle("on", k===i);
    b.classList.remove("hot");
  });
  placePill(i, fresh);
  setNavH();
}
window.addEventListener("resize", ()=>{ setNavH(); placePill(TAB_META.findIndex(([v])=>v===view), true); });

// trascinamento sul tabbar: la pillola segue il dito, la voce sotto si accende,
// la schermata cambia al rilascio (non a ogni passaggio: eviterebbe 4 render di fila)
function bindNavDrag(){
  const bar=navwrap.querySelector(".tabbar");
  const pill=navwrap.querySelector(".pill");
  let pid=null, startX=0, dragging=false, hot=-1;
  const idxAt=x=>{
    const w=bar.getBoundingClientRect().width;
    return Math.max(0, Math.min(TAB_META.length-1, Math.floor(x/(w/TAB_META.length))));
  };
  const btns=()=>[...bar.querySelectorAll("button")];
  const paintHot=()=>btns().forEach((b,k)=>b.classList.toggle("hot", dragging && k===hot));
  const reset=()=>{
    dragging=false; hot=-1; pid=null;
    bar.classList.remove("dragging");
    paintHot();
  };

  bar.addEventListener("pointerdown", e=>{
    pid=e.pointerId; startX=e.clientX; dragging=false;
    try{ bar.setPointerCapture(pid); }catch(_){ /* puntatore gia' rilasciato: nessun capture */ }
  });
  bar.addEventListener("pointermove", e=>{
    if(pid===null || e.pointerId!==pid) return;
    if(!dragging){
      if(Math.abs(e.clientX-startX)<7) return;      // micro-movimento: e' un tap, non un trascinamento
      dragging=true; bar.classList.add("dragging");
    }
    const r=bar.getBoundingClientRect();
    const x=e.clientX-r.left, half=r.width/TAB_META.length/2;
    pill.classList.remove("off");
    pill.style.transform=`translateX(${Math.max(0, Math.min(r.width-half*2, x-half))}px)`;
    const n=idxAt(x);
    if(n!==hot){ hot=n; paintHot(); if(navigator.vibrate) navigator.vibrate(8); }
  });
  bar.addEventListener("pointerup", e=>{
    if(pid===null) return;
    const target = dragging && hot>=0 ? TAB_META[hot][0] : null;
    const wasDragging = dragging;
    reset();
    if(target){
      suppressClick=true; setTimeout(()=>suppressClick=false, 450);   // il trascinamento non e' anche un tap
      if(target!==view) goTab(target); else placePill(hot);
    } else if(wasDragging){
      placePill(TAB_META.findIndex(([v])=>v===view));
    }
  });
  bar.addEventListener("pointercancel", ()=>{
    const back=TAB_META.findIndex(([v])=>v===view);
    reset(); placePill(back);
  });
  // il tap normale resta un tap
  btns().forEach(b=>b.addEventListener("click", ()=>{ if(!dragging) goTab(b.dataset.tab); }));
}

function exCard(e,ei,a){
  if(e.skipped) return `
    <div class="ex-card skipped">

  const lp=lastPerf(e.exId, a.id, e.name);

  const rows=e.sets.map((s,si)=>{
    const last = lp&&lp.sets[si] ? `${lp.sets[si].kg||"-"}kg × ${lp.sets[si].reps||"-"}` : "";
    const open = s._noteOpen || (s.note && s.note.length);
    const isPR = setCounted(s) && histBest>0 && parseFloat(s.kg)>histBest && parseInt(s.reps,10)>0;
    return `<div class="set-row ${s.done?'done':''}">
      <span class="si">${si+1}</span>

      <div class="fld"><input inputmode="numeric" value="${esc(s.reps)}" placeholder="${lp&&lp.sets[si]?esc(lp.sets[si].reps):'-'}" oninput="setVal(${ei},${si},'reps',this.value)"><span class="unit">rep</span></div>
      <button class="chk ${s.done?'on':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':''}</button>
      <button class="setnote-btn ${s.note?'has':''}" onclick="toggleSetNote(${ei},${si})" aria-label="Nota serie">✎</button>
      ${si===0&&last?`<div class="last">scorsa volta: ${esc(last)}</div>`:''}
      ${open?`<input class="setnote" placeholder="Nota serie ${si+1}..." value="${esc(s.note||'')}" oninput="setNote(${ei},${si},this.value)">`:''}

  }).join("");

    </div>
    <input class="note-in" placeholder="Nota esercizio (opzionale)..." value="${esc(e.note)}" oninput="exNote(${ei},this.value)">
  </div>`;
}
function viewSession(){
  const a=DB.active;
  if(!a) return viewHome();
  const doneCount=a.entries.filter(e=>e.sets.some(s=>s.done)||e.skipped).length;
  // raggruppa gli esercizi consecutivi con lo stesso ss in un blocco superset
  const blocks=[];
  a.entries.forEach((e,ei)=>{
    const prev=blocks[blocks.length-1];
    if(e.ss && prev && prev.ss===e.ss) prev.items.push({e,ei});
    else blocks.push({ss:e.ss, items:[{e,ei}]});
  });
  const cards=blocks.map(b=>{
    const inner=b.items.map(({e,ei})=>exCard(e,ei,a)).join("");
    if(b.ss && b.items.length>1)
      return `<div class="ss-group"><div class="ss-head">◇ Superset · alterna senza pausa</div>${inner}</div>`;
    return inner;
  }).join("");
  return `<div class="screen" style="padding-bottom:120px">
    <div class="sess-bar">
      <button class="sess-back" onclick="goBack()" aria-label="Torna indietro (la sessione resta aperta)">‹</button>
      <div class="clock ${a.pausedAt?'paused':''}" id="sessClock">${fmtDur(sessionElapsed())}<small></small></div>
      <div class="t"><div class="name">${esc(a.dayName)}</div><div class="prog">${doneCount}/${a.entries.length} esercizi</div></div>
      <button class="sess-pause" onclick="togglePauseSession()" aria-label="${a.pausedAt?'Riprendi cronometro':'Pausa cronometro'}">${a.pausedAt?'▶':'⏸'}</button>
      <button class="sess-cancel" onclick="confirmCancel()" aria-label="Annulla sessione">✕</button>
      <div class="sess-prog"><i style="width:${Math.round(doneCount/a.entries.length*100)}%"></i></div>
    </div>
    ${cards}
    <div class="row" style="margin-top:16px">
      <button class="btn danger grow" onclick="confirmCancel()">Annulla</button>
      <button class="btn accent grow" onclick="confirmFinish()">Termina &amp; salva</button>
    </div>
  </div>`;
}
// una serie e' "contata" se e' stata spuntata, oppure se e' stata digitata a mano
// (anche senza spunta) - solo il prefill mai toccato resta escluso
function setCounted(s){ return s.done || !s.prefilled; }
function setVal(ei,si,k,v){ const s=DB.active.entries[ei].sets[si]; s[k]=v; s.prefilled=false; save(); }
function toggleSet(ei,si){

  if(s.done){ const rs=DB.active.entries[ei].restSec; if(rs>0) startRest(rs); }

function toggleSetNote(ei,si){ const s=DB.active.entries[ei].sets[si]; s._noteOpen=!s._noteOpen; save(); render(); }
function setNote(ei,si,v){ DB.active.entries[ei].sets[si].note=v; save(); }
function confirmFinish(){

/* ============ CALCOLO DISCHI ============ */
const PLATES_KG=[25,20,15,10,5,2.5,1.25];   // dischi standard per lato (kg)
function platesPerSide(perSide){
  const out=[]; let rem=Math.round(perSide*100)/100;
  for(const p of PLATES_KG){ while(rem>=p-1e-9){ out.push(p); rem=Math.round((rem-p)*100)/100; } }
  return {out, rem};
}
function openPlateCalc(prefillKg){
  const sh=ensureSheet();
  const initTotal = prefillKg>0?prefillKg:"";
  sh.innerHTML=`<div class="grab"></div><h3>Calcolo dischi</h3>
    <div class="field"><label>Peso totale (kg)</label><input id="pc_total" inputmode="decimal" value="${esc(initTotal)}" placeholder="60"></div>
    <div class="field"><label>Bilanciere (kg)</label><input id="pc_bar" inputmode="decimal" value="20" placeholder="20"></div>
    <div id="pc_out" class="pc-out"></div>`;
  const draw=()=>{
    const total=parseFloat(String($("#pc_total").value).replace(",","."))||0;
    const bar=parseFloat(String($("#pc_bar").value).replace(",","."))||0;
    const out=$("#pc_out");
    if(total<=0){ out.innerHTML=`<p class="sheet-msg">Inserisci il peso totale.</p>`; return; }
    if(total<bar){ out.innerHTML=`<p class="sheet-msg" style="color:var(--red)">Il totale è minore del bilanciere (${bar} kg).</p>`; return; }
    const perSide=(total-bar)/2;
    const {out:pl, rem}=platesPerSide(perSide);
    const chips = pl.length ? pl.map(p=>`<span class="plate">${p}</span>`).join("") : `<span class="sheet-msg" style="margin:0">Solo bilanciere.</span>`;
    out.innerHTML=`
      <div class="pc-line">Per lato: <b>${perSide%1?perSide.toFixed(2):perSide} kg</b> ${pl.length?`· ${pl.length} dischi`:''}</div>
      <div class="plate-row">${chips}</div>
      ${rem>0.001?`<p class="sheet-msg" style="color:var(--red)">⚠ ${rem.toFixed(2)} kg per lato non copribili con i dischi standard.</p>`:''}`;
  };
  $("#pc_total").addEventListener('input',draw);
  $("#pc_bar").addEventListener('input',draw);
  showSheet(); draw();
  requestAnimationFrame(()=>$("#pc_total").focus());
}

/* ============ SHEET ============ */
// crea (una volta) il contenitore bottom-sheet e restituisce l'elemento .sheet
function ensureSheet(){
  let bg=$("#sheetBg");
  if(!bg){ bg=document.createElement("div"); bg.id="sheetBg"; bg.className="sheet-bg"; bg.onclick=e=>{if(e.target===bg)closeSheet();};
    const sh=document.createElement("div"); sh.id="sheet"; sh.className="sheet"; bg.appendChild(sh); document.body.appendChild(bg); }
  return $("#sheet");
}
function showSheet(){ const bg=$("#sheetBg"),sh=$("#sheet"); requestAnimationFrame(()=>{ bg.classList.add("show"); sh.classList.add("show"); }); }
function closeSheet(){ const bg=$("#sheetBg"),sh=$("#sheet"); if(!bg)return; sh.classList.remove("show"); bg.classList.remove("show"); }

function openSheet(title, items){
  const sh=ensureSheet();
  sh.innerHTML = `<div class="grab"></div><h3>${title}</h3>` +
    items.map((it,i)=>`<button class="sheet-item ${it.danger?'danger':''}" data-i="${i}"><span class="ic">${it.ic||''}</span>${it.label}</button>`).join("");
  Array.from(sh.querySelectorAll(".sheet-item")).forEach((b,i)=>b.onclick=items[i].fn);
  showSheet();
}

// conferma in-app (sostituisce confirm()): onOk chiamato se l'utente conferma
function confirmSheet(title, msg, opts={}){
  const {okLabel="Conferma", cancelLabel="Annulla", danger=false, onOk} = opts;
  const sh=ensureSheet();
  sh.innerHTML = `<div class="grab"></div><h3>${esc(title)}</h3>`+
    (msg?`<p class="sheet-msg">${esc(msg)}</p>`:``)+
    `<div class="row">
      <button class="btn ghost grow" data-x>${esc(cancelLabel)}</button>
      <button class="btn ${danger?'danger':'accent'} grow" data-ok>${esc(okLabel)}</button>
    </div>`;
  sh.querySelector('[data-x]').onclick=closeSheet;
  sh.querySelector('[data-ok]').onclick=()=>{ closeSheet(); if(onOk)onOk(); };
  showSheet();
}

// input in-app (sostituisce prompt()): fields=[{id,label,value,placeholder,inputmode}]
// onOk(valori) riceve un oggetto {id:stringa}; deve chiamare closeSheet() al successo
function openForm(title, fields, opts={}){
  const {okLabel="Salva", onOk} = opts;
  const sh=ensureSheet();
  sh.innerHTML = `<div class="grab"></div><h3>${esc(title)}</h3>`+
    fields.map(f=>`<div class="field"><label>${esc(f.label)}</label>
      <input id="ff_${f.id}" ${f.list?`list="${f.list}"`:''} ${f.inputmode?`inputmode="${f.inputmode}"`:''} value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}"></div>`).join("")+
    `<button class="btn accent block" data-ok>${esc(okLabel)}</button>`;
  const submit=()=>{ const v={}; fields.forEach(f=>v[f.id]=$("#ff_"+f.id).value); if(onOk)onOk(v); };
  sh.querySelector('[data-ok]').onclick=submit;
  // invio da tastiera sull'ultimo campo
  const inputs=sh.querySelectorAll('input');
  inputs.forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();submit();} }));
  showSheet();
  requestAnimationFrame(()=>{ if(inputs[0]) inputs[0].focus(); });
}
