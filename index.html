/* ============ STORICO ============ */
// quante PR (record di carico) ha segnato ogni sessione, scorrendo la storia in ordine
function sessionPRcounts(){
  const best={}, res={};
  for(const s of DB.sessions){
    let c=0;
    for(const e of s.entries){
      if(e.skipped) continue;
      let top=0;
      for(const x of e.sets){ const k=parseFloat(x.kg), r=parseInt(x.reps,10); if(k>0&&r>0&&k>top)top=k; }
      if(top<=0) continue;
      const prev=best[e.exId]||0;
      if(prev>0 && top>prev) c++;
      if(top>prev) best[e.exId]=top;
    }
    res[s.id]=c;
  }
  return res;
}
function viewHistory(){
  const ss=[...DB.sessions].reverse();
  const prMap=sessionPRcounts();
  const body = ss.length? ss.map(s=>{
    const prc=prMap[s.id]||0;
    const cid=String(s.id).slice(-6);
    const sets=s.entries.reduce((n,e)=>n+(e.skipped?0:e.sets.filter(x=>x.kg||x.reps).length),0);
    const vol=s.entries.reduce((v,e)=>v+(e.skipped?0:e.sets.reduce((a,x)=>a+setVolume(x,e.bilateral),0)),0);
    const det=s.entries.map(e=>{
      if(e.skipped) return `<div class="de"><span>${esc(e.name)}</span><b class="faint">saltato</b></div>`;
      const done=e.sets.filter(x=>x.kg||x.reps).map(x=>`${x.kg||"-"}×${x.reps||"-"}`).join("  ");
      const setNotes=e.sets.filter(x=>x.note).map((x,i)=>esc(x.note)).join(" · ");
      const exNoteLine=e.note?`<div class="de-note">📝 ${esc(e.note)}</div>`:'';
      const setNoteLine=setNotes?`<div class="de-note">↳ ${setNotes}</div>`:'';
      return `<div class="de"><span>${esc(e.name)}</span><b>${done||"-"}</b></div>${exNoteLine}${setNoteLine}`;
    }).join("");
    return `<div class="hist" onclick="this.classList.toggle('open')">
      <div class="h">
        <span class="d">${esc(s.dayName)}</span>
        ${prc>0?`<span class="log-pr">🏆 ${prc} PR</span>`:''}
        <span class="when">${dayLabel(s.date)}</span>
      </div>
      <div class="meta"><span class="cid">#${cid}</span> ⏱ ${fmtDur(s.durationSec)} · ${sets} serie</div>
      <div class="meta vol">volume ${Math.round(vol).toLocaleString('it-IT')} kg</div>
      <div class="det">${det}</div>
    </div>`;
  }).join("") : `<div class="empty"><div class="ic">\u{1F4CB}</div><p>Ancora nessun allenamento salvato.<br>Fai la prima sessione e comparira' qui.</p></div>`;
  return `<div class="screen">
    <div class="topbar"><div><div class="sub">Diario</div><h1 style="font-size:30px">Sto<span>rico</span></h1></div></div>
    ${DB.sessions.length?`<div class="muted mono" style="font-size:12px;margin-bottom:14px">${DB.sessions.length} sessioni totali</div>`:''}
    ${body}
  </div>`;
}

/* ============ GRAFICI ============ */
function allExercises(){
  const map=new Map();
  DB.schema.days.forEach(d=>d.exercises.forEach(e=>{ if(!map.has(e.id)) map.set(e.id,e.name); }));
  DB.sessions.forEach(s=>s.entries.forEach(e=>{ if(!map.has(e.exId)) map.set(e.exId,e.name); }));
  return [...map.entries()].map(([id,name])=>({id,name}));
}
// 1RM stimato (formula di Epley): 1RM = peso × (1 + reps/30). A 1 rep = peso.
function e1rm(kg,reps){ const k=+kg||0, r=+reps||0; if(k<=0||r<=0)return 0; if(r===1)return k; return k*(1+r/30); }
// serie temporale per esercizio. metric: 'top' = max kg sollevato · 'e1rm' = 1RM stimato max
function exerciseSeries(exId, metric="top"){
  const pts=[];
  DB.sessions.forEach(s=>{
    const e=s.entries.find(x=>x.exId===exId && !x.skipped);
    if(!e)return;
    let best=0;
    e.sets.forEach(x=>{
      const val = metric==="e1rm" ? e1rm(x.kg,x.reps) : (+x.kg||0);
      if(val>best) best=val;
    });
    if(best>0) pts.push({x:new Date(s.date).getTime(), y: metric==="e1rm" ? Math.round(best*10)/10 : best});
  });
  return pts;
}
// chiave giorno locale (evita gli scostamenti UTC di toISOString)
function dkey(d){ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekStartLocal(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
// statistiche settimana corrente: giorni allenati Lun..Dom, conteggio, streak di settimane
function weekStats(){
  const now=new Date(), todayKey=dkey(now), wkNow=weekStartLocal(now);
  const dset=new Set(DB.sessions.map(s=>dkey(s.date)));
  const letters=["L","M","M","G","V","S","D"];
  const days=[]; let cnt=0;
  for(let i=0;i<7;i++){
    const d=new Date(wkNow); d.setDate(wkNow.getDate()+i);
    const key=dkey(d), on=dset.has(key);
    if(on)cnt++;
    days.push({on, today:key===todayKey, letter:letters[i]});
  }
  // streak = settimane consecutive con almeno 1 allenamento (se questa sett. è ancora vuota, parte da quella prima)
  const wkKeys=new Set(DB.sessions.map(s=>weekStartLocal(s.date).getTime()));
  let streak=0, cur=new Date(wkNow);
  if(!wkKeys.has(cur.getTime())) cur.setDate(cur.getDate()-7);
  while(wkKeys.has(cur.getTime())){ streak++; cur.setDate(cur.getDate()-7); }
  return {days, cnt, streak};
}
function volumeByWeek(){
  const wk=new Map();
  DB.sessions.forEach(s=>{
    const d=new Date(s.date); const day=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
    const key=mon.getTime();
    let v=0; s.entries.forEach(e=>{ if(e.skipped)return; e.sets.forEach(x=>v+=setVolume(x,e.bilateral)); });
    wk.set(key,(wk.get(key)||0)+v);
  });
  return [...wk.entries()].sort((a,b)=>a[0]-b[0]).map(([x,y])=>({x,y}));
}

function lineChart(pts,{color="#ff6a1a",unit="kg",h=150}={}){
  if(pts.length===0) return `<div class="empty" style="padding:24px"><p>Nessun dato ancora.</p></div>`;
  if(pts.length===1){ return `<div class="empty" style="padding:24px"><p>Solo 1 rilevazione: <b style="color:var(--ink)">${pts[0].y} ${unit}</b>.<br>Servono almeno 2 per il grafico.</p></div>`; }
  const W=520,H=h,pad={l:38,r:12,t:12,b:22};
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const xmin=Math.min(...xs),xmax=Math.max(...xs);
  let ymin=Math.min(...ys),ymax=Math.max(...ys); if(ymin===ymax){ymin-=1;ymax+=1;} const yr=ymax-ymin; ymin-=yr*0.1; ymax+=yr*0.1;
  const X=x=>pad.l+(xmax===xmin?0.5:(x-xmin)/(xmax-xmin))*(W-pad.l-pad.r);
  const Y=y=>pad.t+(1-(y-ymin)/(ymax-ymin))*(H-pad.t-pad.b);
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=`M${X(pts[0].x).toFixed(1)} ${(H-pad.b)} `+pts.map(p=>"L"+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ")+` L${X(pts[pts.length-1].x).toFixed(1)} ${(H-pad.b)} Z`;
  const grid=[0,.5,1].map(t=>{const y=pad.t+t*(H-pad.t-pad.b);const val=(ymax-(t)*(ymax-ymin));return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#332d26" stroke-width="1"/><text x="4" y="${y+4}" fill="#6f6659" font-size="10" font-family="monospace">${Math.round(val)}</text>`;}).join("");
  const dots=pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${color}"/>`).join("");
  const lastLbl=`<text x="${X(pts[pts.length-1].x).toFixed(1)}" y="${Y(pts[pts.length-1].y)-8}" fill="${color}" font-size="11" font-family="monospace" text-anchor="end">${ys[ys.length-1]}${unit}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lastLbl}
  </svg>`;
}
function barChart(pts,{color="#6aa9ff",h=150}={}){
  if(pts.length===0) return `<div class="empty" style="padding:24px"><p>Nessun dato ancora.</p></div>`;
  const W=520,H=h,pad={l:38,r:12,t:12,b:22};
  const ys=pts.map(p=>p.y); const ymax=Math.max(...ys,1);
  const n=pts.length;
  const avail=W-pad.l-pad.r;
  const step=Math.min(avail/n, 72);          // niente barre giganti con poche settimane
  const bw=Math.min(step*0.6, 46);
  const grid=[0,.5,1].map(t=>{const y=pad.t+t*(H-pad.t-pad.b);const val=ymax*(1-t);return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#332d26"/><text x="4" y="${y+4}" fill="#857c6d" font-size="10" font-family="monospace">${Math.round(val/1000)}k</text>`;}).join("");
  const bars=pts.map((p,i)=>{const x=pad.l+i*step+step/2-bw/2;const bh=(p.y/ymax)*(H-pad.t-pad.b);const y=H-pad.b-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="4" fill="${color}"><title>${Math.round(p.y).toLocaleString('it-IT')} kg</title></rect>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>`;
}
function viewCharts(){
  const exs=allExercises();
  if(!chartExId && exs.length) chartExId=exs[0].id;
  const chips=exs.map(e=>`<button class="chip ${e.id===chartExId?'on':''}" onclick="chartExId='${e.id}';render()">${esc(e.name)}</button>`).join("");
  const series=chartExId?exerciseSeries(chartExId, chartMetric):[];
  const exName=exs.find(e=>e.id===chartExId)?.name||"";
  const isE1=chartMetric==="e1rm";
  const metricToggle=`<div class="seg">
    <button class="${!isE1?'on':''}" onclick="chartMetric='top';render()">Carico max</button>
    <button class="${isE1?'on':''}" onclick="chartMetric='e1rm';render()">1RM stimato</button>
  </div>`;
  const vol=volumeByWeek();
  return `<div class="screen">
    <div class="topbar"><div><div class="sub">Andamento</div><h1 style="font-size:30px">Gra<span>fici</span></h1></div></div>
    <div class="sec-h">Forza per esercizio</div>
    <div class="chip-row">${chips||'<span class="faint mono" style="font-size:12px">Nessun esercizio</span>'}</div>
    ${exs.length?metricToggle:''}
    <div class="chart-wrap">
      <div class="ct">${esc(exName)||"Esercizio"}</div>
      <div class="cs">${isE1?'1RM stimato per sessione (Epley: kg × (1 + reps/30))':'Peso massimo sollevato per sessione (kg)'}</div>
      ${lineChart(series,{color:"#ff6a1a",unit:"kg"})}
    </div>
    <div class="sec-h">Volume settimanale</div>
    <div class="chart-wrap">
      <div class="ct">Tonnellaggio</div>
      <div class="cs">kg per settimana (peso × reps)</div>
      ${barChart(vol,{color:"#6aa9ff"})}
    </div>
  </div>`;
}

/* ============ PESO CORPOREO ============ */
function viewWeight(){
  const bw=[...DB.bodyweight].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pts=bw.map(w=>({x:new Date(w.date).getTime(), y:+w.kg}));
  const last=bw.length?bw[bw.length-1]:null;
  const first=bw.length?bw[0]:null;
  const diff=(last&&first)?(last.kg-first.kg):0;
  const list=[...bw].reverse().slice(0,30).map(w=>`
    <div class="hist" style="padding:12px 14px">
      <div class="h"><span class="d" style="font-size:18px">${(+w.kg).toFixed(1)} kg</span><span class="when">${dayLabel(w.date)}</span></div>
    </div>`).join("") || `<div class="empty"><div class="ic">⚖</div><p>Segna il tuo peso per vederne l'andamento.</p></div>`;
  return `<div class="screen">
    <div class="topbar"><div><div class="sub">Ricomposizione</div><h1 style="font-size:30px">Pe<span>so</span></h1></div>
      <div class="spacer"></div><button class="btn accent sm" onclick="addWeight()">+ Segna</button></div>
    ${last?`<div class="card row" style="align-items:baseline;gap:16px">
      <div><div class="faint mono" style="font-size:10px;letter-spacing:.12em">ATTUALE</div><div style="font-family:var(--display);font-size:40px;line-height:1">${(+last.kg).toFixed(1)}<span style="font-size:16px;color:var(--ink-faint)"> kg</span></div></div>
      ${bw.length>1?`<div><div class="faint mono" style="font-size:10px;letter-spacing:.12em">DALL'INIZIO</div><div style="font-family:var(--display);font-size:40px;line-height:1;color:${diff<=0?'var(--green)':'var(--accent)'}">${diff>0?'+':''}${diff.toFixed(1)}<span style="font-size:16px;color:var(--ink-faint)"> kg</span></div></div>`:''}
    </div>`:''}
    <div class="chart-wrap">
      <div class="ct">Andamento peso</div><div class="cs">kg nel tempo</div>
      ${lineChart(pts,{color:"#7bd88f",unit:"kg",h:160})}
    </div>
    <div class="sec-h">Storico</div>
    ${list}
  </div>`;
}
function addWeight(){
  const last=DB.bodyweight.length?DB.bodyweight[DB.bodyweight.length-1].kg:"";
  openForm("Peso di oggi", [{id:"kg",label:"Peso corporeo (kg)",value:last,placeholder:"85",inputmode:"decimal"}],
    {onOk:v=>{
      const kg=parseFloat(String(v.kg).replace(",",".")); if(!(kg>0)){toast("Valore non valido");return;}
      const today=new Date().toISOString().slice(0,10);
      const ex=DB.bodyweight.find(w=>w.date.slice(0,10)===today);
      if(ex) ex.kg=kg; else DB.bodyweight.push({date:new Date().toISOString(),kg});
      save(); closeSheet(); render(); toast("Peso salvato ✓");
    }});
}

/* ============ EXPORT / IMPORT ============ */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="setlog-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast("Backup esportato");
}
// import: legge un .json esportato e SOSTITUISCE i dati (dopo conferma). Errori sempre visibili.
function importData(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onerror=()=>toast("Errore nella lettura del file");
    reader.onload=()=>{
      let data;
      try{ data=JSON.parse(reader.result); }
      catch(e){ console.error("Import: JSON illeggibile",e); toast("File non valido (JSON illeggibile)"); return; }
      if(!data || typeof data!=="object" || !data.schema || !Array.isArray(data.schema.days)){
        toast("Backup non riconosciuto"); return;
      }
      const nDays=data.schema.days.length;
      const nSess=Array.isArray(data.sessions)?data.sessions.length:0;
      confirmSheet("Importare il backup?",
        `Trovati ${nDays} giorni e ${nSess} allenamenti salvati. Importando SOSTITUISCI tutti i dati attuali (scheda, storico, peso). Se vuoi conservarli, esporta prima un backup.`,
        {okLabel:"Importa e sostituisci", danger:true, onOk:()=>{
          DB={ schema:data.schema, sessions:data.sessions||[], bodyweight:data.bodyweight||[], active:data.active||null,
               migrations:data.migrations||{} };
          migrateNoPullups();          // un backup vecchio puo' riportare le trazioni
          migrateChestDipsAndLegs();   // idem per croci ai cavi / leg extension
          migrateBilateralAndChestSwap();  // rinomina/flag: surgical, non sovrascrive la scheda
          migrateAddVolumeV4();            // idem, aggiunge esercizi se il backup e' vecchio
          migrateReorderV5();               // idem, sistema l'ordine se il backup e' vecchio
          save(); render(); toast("Backup importato ✓");
        }});
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ============ AGGIORNAMENTO APP ============ */
// forza un refresh pulito: disinstalla il service worker, svuota la cache
// e ricarica con un parametro anti-cache. I dati in localStorage non vengono toccati.
async function checkForUpdates(){
  toast("Controllo aggiornamenti...");
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ console.error("Aggiornamento: errore pulizia cache/service worker", e); }
  location.href = location.pathname + "?v=" + Date.now();
}

{

  if(notes.length) toast("Scheda aggiornata: " + notes.join("; "));
}
